# Releasable posture: builds the same image CI ships.
# Config and migrations are baked into the image (/config/app.yaml, /migrations);
# no host path mounts to drift out of sync.
services:
  minisvc:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: minisvc:${VERSION:-dev}
    ports:
      - "8080:8080"
    volumes:
      - minisvc-data:/var/lib/minisvc
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  minisvc-data:
